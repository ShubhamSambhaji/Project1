<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Successful</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f2f6fb;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
}

/* main card */
.success-card{
    background:white;
    width:420px;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    text-align:center;
    transform:translateY(40px);
    opacity:0;
    animation: slideUp 0.7s ease forwards;
}

@keyframes slideUp{
    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* check circle */
.check-circle{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#0b132b;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:45px;
    transform:scale(0);
    animation: pop 0.5s ease forwards 0.3s;
}

@keyframes pop{
    to{ transform:scale(1); }
}

/* confetti dots */
.confetti{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#0b132b;
    animation: burst 1s ease-out forwards;
}

@keyframes burst{
    0%{ transform:scale(1) translate(0,0); opacity:1; }
    100%{ transform:scale(1) translate(var(--x),var(--y)); opacity:0; }
}

h2{
    margin:10px 0;
}

p{
    color:#555;
}

.btn{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:#0b132b;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="confetti-container"></div>

<div class="success-card">
    <div class="check-circle">✔</div>
    <h2>Hooray! Payment Successful</h2>
    <p>Your order has been placed.</p>
    <p>You will receive an email confirmation shortly.</p>
    <button class="btn" onclick="goHome()">Shop More</button>
</div>

<script>
function goHome(){
    window.location.href="index.html";
}

// create confetti burst
function makeConfetti(){
    const container = document.getElementById("confetti-container");

    for(let i=0;i<25;i++){
        const dot = document.createElement("div");
        dot.classList.add("confetti");

        const x = (Math.random()*200 - 100) + "px";
        const y = (Math.random()*200 - 100) + "px";

        dot.style.setProperty("--x", x);
        dot.style.setProperty("--y", y);

        dot.style.left = "50%";
        dot.style.top = "50%";

        container.appendChild(dot);

        setTimeout(()=>dot.remove(), 1000);
    }
}

setTimeout(makeConfetti, 500);
</script>

</body>
</html>
